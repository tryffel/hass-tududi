create_task:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: tududi
    name:
      required: true
      example: "Electricity invoice"
      selector:
        text:
    due_date:
      example: "2026-11-01"
      selector:
        date:
    priority:
      selector:
        select:
          translation_key: priority
          options: [low, medium, high]
    status:
      selector:
        select:
          translation_key: status
          options: [not_started, in_progress, waiting, planned, done]
    project:
      example: "Household bills"
      selector:
        text:
    tags:
      example: "invoice"
      selector:
        text:
          multiple: true
    note:
      example: "Amount 52.10 EUR, ref 1234 5678"
      selector:
        text:
          multiline: true
    assigned_to:
      example: "Giulia"
      selector:
        text:

